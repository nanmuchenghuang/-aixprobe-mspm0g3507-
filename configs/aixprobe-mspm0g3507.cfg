# AixProbe V821 CH347F -> TI MSPM0G3507, SWD mode.
# Requires an OpenOCD build that includes:
#   - src/jtag/drivers/ch347.c
#   - tcl/target/ti/mspm0.cfg
#   - src/flash/nor/mspm0.c

adapter driver ch347

# Uncomment only if auto-detection selects the wrong CH347 device.
# ch347 vid_pid 0x1a86 0x55de

transport select swd

# Start conservatively for CH347 SWD and MSPM0 AP transactions.
adapter speed 500

# Do not use board/ti/mspm0-launchpad.cfg here: that board file selects
# XDS110 and 10 MHz, not AixProbe's CH347F.
source [find target/ti/mspm0.cfg]

# After the link is stable, 1000 kHz is a reasonable next step.
# adapter speed 1000
